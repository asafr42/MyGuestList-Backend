name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        run: npm install

      - name: Run Backend Unit Tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key
        run: npm test

  integration-tests:
    name: Run Integration Tests (API)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Start services (docker-compose up)
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:5000/health | grep -q '"status":"ok"'; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "Backend failed to become healthy within 60 seconds"
          docker compose logs
          exit 1

      - name: Run API Integration Tests
        run: |
          chmod +x e2e/e2e-infra-test.sh
          API_URL=http://localhost:5000 bash e2e/e2e-infra-test.sh

      - name: Clean up
        if: always()
        run: docker compose down

  build-and-publish:
    name: Build & Publish Backend to AWS ECR
    needs: integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Backend Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: myguestlist-backend
          IMAGE_TAG: ${{ steps.tag_version.outputs.new_version }} 
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Kubernetes Deployment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: myguestlist-backend
          IMAGE_TAG: ${{ steps.tag_version.outputs.new_version }}
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name asaf-cluster --role-arn arn:aws:iam::329437500409:role/AntigravityRestrictedRole
          kubectl set image deployment/backend backend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          kubectl rollout status deployment/backend

  smoke-test-prod:
    name: Post-Deployment Smoke Test
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Smoke Test on Production
        env:
          # You should set this in GitHub Secrets or determine it dynamically
          API_URL: ${{ secrets.PROD_API_URL }} 
        run: |
          if [ -z "$API_URL" ]; then
            echo "PROD_API_URL not set, skipping smoke test. Please add it to GitHub Secrets."
            exit 0
          fi
          chmod +x e2e/e2e-infra-test.sh
          bash e2e/e2e-infra-test.sh

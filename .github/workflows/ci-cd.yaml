name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        run: npm install

      - name: Run Backend Unit Tests
        run: |
          node -e "
          const assert = require('assert');
          console.log('Running Inline Unit Test...');

          const calculateStats = (guests) => {
            return {
              totalInvited: guests.reduce((sum, g) => sum + g.invitedCount, 0),
              totalConfirmed: guests.reduce((sum, g) => sum + g.confirmedCount, 0)
            };
          };

          const stats = calculateStats([
            { invitedCount: 2, confirmedCount: 2 },
            { invitedCount: 3, confirmedCount: 1 }
          ]);

          assert.strictEqual(stats.totalInvited, 5);
          assert.strictEqual(stats.totalConfirmed, 3);
          console.log('Unit test passed! Stats calculated correctly.');
          "

  integration-tests:
    name: Run Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy testing environment (docker-compose up)
        run: docker compose up -d --build

      - name: Wait for Containers to be Ready
        run: sleep 15

      - name: Run API Integration Tests
        run: |
          echo "Registering test user..."
          TOKEN=$(curl -sf -X POST http://localhost:5000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","password":"testpassword123"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

          if [ -z "$TOKEN" ]; then
            echo "Failed to get auth token!"
            exit 1
          fi
          echo "Token obtained successfully."

          echo "Testing GET /api/guests..."
          curl -f http://localhost:5000/api/guests \
            -H "Authorization: Bearer $TOKEN" || exit 1

          echo "Testing POST /api/guests..."
          curl -f -X POST http://localhost:5000/api/guests \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"firstName":"Integration","lastName":"Test","phone":"000-0000","side":"Bride","category":"Friends","invitedCount":1,"confirmedCount":1}' || exit 1

      - name: Clean up test environment
        if: always()
        run: docker compose down

  e2e-tests:
    name: Run E2E Infrastructure Tests
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Start full stack (docker-compose up)
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: sleep 20

      - name: Run E2E Infrastructure Tests
        run: |
          chmod +x e2e/e2e-infra-test.sh
          API_URL=http://localhost:5000 bash e2e/e2e-infra-test.sh

      - name: Clean up
        if: always()
        run: docker compose down

  build-and-publish:
    name: Build & Publish Backend to AWS ECR
    needs: e2e-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Backend Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: myguestlist-backend
          IMAGE_TAG: ${{ steps.tag_version.outputs.new_version }} 
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Kubernetes Deployment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: myguestlist-backend
          IMAGE_TAG: ${{ steps.tag_version.outputs.new_version }}
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name asaf-cluster
          kubectl set image deployment/backend backend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          kubectl rollout status deployment/backend

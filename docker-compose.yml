version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=supersecretpassword
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet --username admin --password supersecretpassword --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://admin:supersecretpassword@mongodb:27017/myguestlist?authSource=admin
      - JWT_SECRET=bXlndWVzdGxpc3Qtc2VjcmV0LWtleQ==
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
